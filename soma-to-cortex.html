<title>Soma to Cortex</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Spectral:ital,wght@0,400;0,600;0,700;1,400&family=Source+Sans+3:ital,wght@0,400;0,600;0,700;1,400&family=IBM+Plex+Mono:wght@400;500;600&display=swap">

<style>
:root{
  --paper:#F2F4F5;
  --surface:#FFFFFF;
  --surface-2:#E9ECEE;
  --ink:#16191E;
  --ink-2:#414952;
  --muted:#6A7480;
  --line:#D6DBDF;
  --line-2:#C2C9CF;
  --accent:#12626D;
  --accent-soft:#DCEBED;
  --excite:#A83F1C;
  --excite-soft:#F6E4DC;
  --inhibit:#2C568A;
  --inhibit-soft:#DFE7F2;
  --good:#2F6B44;
  --good-soft:#DCEDE1;
  --warn:#8A6410;
  --warn-soft:#F5EAD1;
  --shadow:0 1px 2px rgba(16,24,32,.06),0 4px 16px rgba(16,24,32,.05);
  --r:10px;
  --serif:"Spectral",Georgia,"Times New Roman",serif;
  --sans:"Source Sans 3",-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#111418;
    --surface:#191D23;
    --surface-2:#22272E;
    --ink:#E4E7EA;
    --ink-2:#B3BAC2;
    --muted:#8A939D;
    --line:#2C323A;
    --line-2:#3B434C;
    --accent:#4FAEBB;
    --accent-soft:#16333A;
    --excite:#E0855F;
    --excite-soft:#3A241B;
    --inhibit:#7FA6D6;
    --inhibit-soft:#1C2836;
    --good:#7CC094;
    --good-soft:#1B2C21;
    --warn:#D6AE5C;
    --warn-soft:#2E2718;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 4px 16px rgba(0,0,0,.3);
  }
}
:root[data-theme="dark"]{
  --paper:#111418;
  --surface:#191D23;
  --surface-2:#22272E;
  --ink:#E4E7EA;
  --ink-2:#B3BAC2;
  --muted:#8A939D;
  --line:#2C323A;
  --line-2:#3B434C;
  --accent:#4FAEBB;
  --accent-soft:#16333A;
  --excite:#E0855F;
  --excite-soft:#3A241B;
  --inhibit:#7FA6D6;
  --inhibit-soft:#1C2836;
  --good:#7CC094;
  --good-soft:#1B2C21;
  --warn:#D6AE5C;
  --warn-soft:#2E2718;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 4px 16px rgba(0,0,0,.3);
}

*{box-sizing:border-box}
body{
  margin:0;background:var(--paper);color:var(--ink);
  font-family:var(--sans);font-size:16px;line-height:1.55;
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3,h4{font-family:var(--serif);font-weight:600;text-wrap:balance;margin:0;line-height:1.25}
p{margin:0}
button{font:inherit;color:inherit;cursor:pointer}
a{color:var(--accent)}

/* ---------- shell ---------- */
.shell{display:grid;grid-template-columns:238px minmax(0,1fr);min-height:100%}
.rail{
  background:var(--surface);border-right:1px solid var(--line);
  padding-block:22px 28px;padding-inline:16px;
  position:sticky;top:env(safe-area-inset-top,0px);align-self:start;
  max-height:100vh;overflow-y:auto;
}
.brandmark{display:flex;align-items:baseline;gap:8px;margin-bottom:4px}
.brandmark h1{font-size:19px;letter-spacing:-.01em}
.brandsub{
  font-family:var(--mono);font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;
  color:var(--muted);margin-bottom:18px;line-height:1.5;
}
.countdown{
  border:1px solid var(--line);border-radius:var(--r);padding:10px 12px;margin-bottom:18px;
  background:var(--surface-2);
}
.countdown .n{font-family:var(--mono);font-size:26px;font-weight:600;line-height:1;color:var(--excite);font-variant-numeric:tabular-nums}
.countdown .l{font-family:var(--mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-top:5px}
nav{display:flex;flex-direction:column;gap:2px}
.navbtn{
  display:flex;align-items:center;justify-content:space-between;gap:8px;
  background:none;border:0;border-radius:7px;padding:7px 10px;text-align:left;
  color:var(--ink-2);font-size:14.5px;
}
.navbtn:hover{background:var(--surface-2)}
.navbtn[aria-current="true"]{background:var(--accent-soft);color:var(--accent);font-weight:600}
.navbtn .tick{font-family:var(--mono);font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
.navgroup{font-family:var(--mono);font-size:10px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);margin:16px 0 6px 10px}

main{min-width:0;padding-block:28px 72px;padding-inline:clamp(16px,3.4vw,44px)}
.wrap{max-width:820px}
.wrap.wide{max-width:1040px}

.pagehead{margin-bottom:22px;padding-bottom:16px;border-bottom:2px solid var(--line-2)}
.pagehead h2{font-size:clamp(25px,3.4vw,33px);letter-spacing:-.015em}
.pagehead .kicker{
  font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;
  color:var(--accent);margin-bottom:7px;
}
.pagehead .lede{color:var(--ink-2);margin-top:9px;max-width:66ch}

/* ---------- outline ---------- */
.sec{margin-bottom:34px}
.sec > h3{
  font-size:19px;padding-bottom:7px;margin-bottom:14px;
  border-bottom:1px solid var(--line);display:flex;align-items:baseline;gap:9px;flex-wrap:wrap;
}
.sec > h3 .src{font-family:var(--mono);font-size:10.5px;letter-spacing:.05em;color:var(--muted);font-weight:400}
ol.out,ul.out{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:7px}
ol.out ol.out,ol.out ul.out{margin-top:7px;padding-left:17px;border-left:1px solid var(--line);gap:6px}
li.row{display:block}
.lbl{font-family:var(--mono);font-size:11.5px;color:var(--muted);margin-right:7px;font-weight:500}
.tm{font-weight:600;color:var(--ink)}
.df{color:var(--ink-2)}
.given{color:var(--muted)}
li.row.filled > .df::before{content:"";display:inline-block}

.chip{
  display:inline-block;font-family:var(--mono);font-size:10px;letter-spacing:.05em;
  padding:1px 6px;border-radius:4px;vertical-align:1px;margin-left:6px;white-space:nowrap;
}
.chip.ref{background:var(--surface-2);color:var(--muted)}
.chip.flagged{background:var(--warn-soft);color:var(--warn);cursor:help}
.chip.prof{background:var(--accent-soft);color:var(--accent)}

.callout{
  border:1px solid var(--line);border-left:3px solid var(--warn);border-radius:0 var(--r) var(--r) 0;
  background:var(--surface);padding:12px 15px;margin:14px 0;font-size:14.5px;color:var(--ink-2);
}
.callout strong{color:var(--ink)}
.callout.acc{border-left-color:var(--accent)}
.callout.exc{border-left-color:var(--excite)}
.callout h4{font-size:15px;margin-bottom:5px;font-family:var(--sans);font-weight:700;color:var(--ink)}

/* ---------- tables ---------- */
.tscroll{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);margin:14px 0}
table{border-collapse:collapse;width:100%;font-size:14.5px;min-width:440px}
caption{
  text-align:left;padding:11px 14px 0;font-family:var(--mono);font-size:10.5px;
  letter-spacing:.08em;text-transform:uppercase;color:var(--muted);
}
th,td{text-align:left;padding:8px 14px;border-bottom:1px solid var(--line);vertical-align:top}
thead th{
  font-family:var(--mono);font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;
  color:var(--muted);font-weight:500;border-bottom:1px solid var(--line-2);
}
tbody tr:last-child td{border-bottom:0}
td.k{font-weight:600;white-space:nowrap}
tr.grp td{background:var(--surface-2);font-family:var(--mono);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}

/* ---------- confusions ---------- */
.conf{border:1px solid var(--line);border-radius:var(--r);background:var(--surface);margin-bottom:16px;overflow:hidden}
.conf > header{padding:12px 16px;border-bottom:1px solid var(--line);display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.conf > header h3{font-size:16.5px}
.conf > header .why{font-size:13.5px;color:var(--muted)}
.split{display:grid;grid-template-columns:repeat(auto-fit,minmax(215px,1fr))}
.side{padding:13px 16px;border-right:1px solid var(--line)}
.side:last-child{border-right:0}
.side h4{font-family:var(--mono);font-size:12px;letter-spacing:.04em;margin-bottom:7px}
.side.e h4{color:var(--excite)}
.side.i h4{color:var(--inhibit)}
.side.n h4{color:var(--accent)}
.side ul{margin:0;padding-left:16px;font-size:14px;color:var(--ink-2);display:flex;flex-direction:column;gap:4px}
.tell{padding:10px 16px;background:var(--surface-2);font-size:14px;border-top:1px solid var(--line)}
.tell b{font-family:var(--mono);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);display:block;margin-bottom:2px}

/* ---------- plan ---------- */
.planbar{display:flex;align-items:center;gap:12px;margin-bottom:18px;flex-wrap:wrap}
.meter{flex:1;min-width:160px;height:7px;background:var(--surface-2);border-radius:99px;overflow:hidden}
.meter > i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .3s}
.day{
  display:grid;grid-template-columns:auto 76px minmax(0,1fr);gap:13px;align-items:start;
  padding:12px 14px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);margin-bottom:7px;
}
.day.today{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
.day.done{opacity:.58}
.day.done .task{text-decoration:line-through;text-decoration-color:var(--line-2)}
.day input[type=checkbox]{width:17px;height:17px;margin-top:3px;accent-color:var(--accent);cursor:pointer}
.dt{font-family:var(--mono);font-size:11.5px;color:var(--muted);line-height:1.45;padding-top:2px}
.dt b{display:block;color:var(--ink-2);font-size:12.5px;font-weight:600}
.task{font-size:14.5px}
.task b{display:block;margin-bottom:2px}
.task span{color:var(--muted);font-size:13.5px}
.day.exam{background:var(--excite-soft);border-color:var(--excite)}
.day.exam .task b{color:var(--excite)}

/* ---------- drill ---------- */
.modes{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:16px}
.mode{
  border:1px solid var(--line-2);background:var(--surface);border-radius:99px;padding:6px 14px;font-size:13.5px;
}
.mode[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.pool{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:18px;align-items:center}
.pool label{font-family:var(--mono);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
select{
  font:inherit;font-size:14px;padding:5px 9px;border:1px solid var(--line-2);border-radius:7px;
  background:var(--surface);color:var(--ink);
}
.card{border:1px solid var(--line);border-radius:var(--r);background:var(--surface);padding:20px;box-shadow:var(--shadow)}
.prompt{font-size:17px;line-height:1.5;margin-bottom:17px}
.prompt .q{font-family:var(--mono);font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);display:block;margin-bottom:7px}
.opts{display:flex;flex-direction:column;gap:7px}
.opt{
  text-align:left;border:1px solid var(--line-2);background:var(--surface);border-radius:8px;padding:10px 13px;font-size:15px;
}
.opt:hover:not(:disabled){border-color:var(--accent);background:var(--accent-soft)}
.opt:disabled{cursor:default}
.opt.right{border-color:var(--good);background:var(--good-soft);color:var(--good);font-weight:600}
.opt.wrong{border-color:var(--excite);background:var(--excite-soft);color:var(--excite)}
.fib{display:flex;gap:8px;flex-wrap:wrap}
.fib input{
  flex:1;min-width:190px;font:inherit;font-size:16px;padding:9px 13px;
  border:1px solid var(--line-2);border-radius:8px;background:var(--surface);color:var(--ink);
}
.fib input:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.btn{border:1px solid var(--ink);background:var(--ink);color:var(--paper);border-radius:8px;padding:9px 17px;font-size:14.5px;font-weight:600}
.btn.ghost{background:none;color:var(--ink);border-color:var(--line-2);font-weight:400}
.verdict{margin-top:15px;padding:12px 14px;border-radius:8px;font-size:14.5px}
.verdict.ok{background:var(--good-soft);color:var(--good)}
.verdict.no{background:var(--excite-soft);color:var(--excite)}
.verdict .ans{display:block;margin-top:5px;color:var(--ink-2)}
.scoreline{display:flex;gap:18px;margin-top:16px;font-family:var(--mono);font-size:12px;color:var(--muted);flex-wrap:wrap}
.scoreline b{color:var(--ink);font-variant-numeric:tabular-nums}

.match{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:9px}
.mcol{display:flex;flex-direction:column;gap:6px}
.mitem{text-align:left;border:1px solid var(--line-2);background:var(--surface);border-radius:8px;padding:9px 12px;font-size:14.5px}
.mitem.sel{border-color:var(--accent);background:var(--accent-soft)}
.mitem.done{border-color:var(--good);background:var(--good-soft);color:var(--good);cursor:default}
.mitem.miss{border-color:var(--excite);background:var(--excite-soft)}
.mitem:disabled{cursor:default}

.weak{display:flex;flex-direction:column;gap:6px}
.weakrow{display:flex;align-items:center;gap:11px;padding:9px 13px;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
.weakrow .bar{flex:1;height:5px;background:var(--surface-2);border-radius:99px;overflow:hidden}
.weakrow .bar > i{display:block;height:100%;background:var(--excite)}
.weakrow .t{font-weight:600;font-size:14.5px;min-width:0}
.weakrow .c{font-family:var(--mono);font-size:11.5px;color:var(--excite);font-variant-numeric:tabular-nums}

.empty{padding:26px;text-align:center;color:var(--muted);border:1px dashed var(--line-2);border-radius:var(--r);font-size:14.5px}
.savenote{font-family:var(--mono);font-size:10.5px;letter-spacing:.06em;color:var(--muted);margin-top:22px}

.fixrow{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:0;border:1px solid var(--line);border-radius:var(--r);overflow:hidden;margin-bottom:9px;background:var(--surface)}
.fixrow > div{padding:11px 14px}
.fixrow > div:first-child{border-right:1px solid var(--line);background:var(--excite-soft)}
.fixrow .h{font-family:var(--mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:3px}
.fixrow .v{font-size:14.5px}

@media (max-width:860px){
  .shell{grid-template-columns:1fr}
  .rail{
    position:sticky;top:0;z-index:20;max-height:none;overflow:visible;
    border-right:0;border-bottom:1px solid var(--line);
    padding-block:calc(10px + env(safe-area-inset-top,0px)) 10px;padding-inline:16px;
  }
  .countdown{display:flex;align-items:baseline;gap:9px;margin-bottom:11px;padding:7px 11px}
  .countdown .n{font-size:19px}
  .countdown .l{margin-top:0}
  nav{flex-direction:row;overflow-x:auto;gap:5px;padding-bottom:3px}
  .navbtn{white-space:nowrap;padding:6px 11px;font-size:13.5px}
  .navgroup{display:none}
  .brandsub{margin-bottom:11px}
  .fixrow{grid-template-columns:1fr}
  .fixrow > div:first-child{border-right:0;border-bottom:1px solid var(--line)}
  .day{grid-template-columns:auto 62px minmax(0,1fr);gap:10px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
</style>

<div class="shell">
  <aside class="rail">
    <div class="brandmark"><h1>Soma to Cortex</h1></div>
    <div class="brandsub">Garrett &amp; Hough 7e · Ch 2–3</div>
    <div class="countdown"><div class="n" id="cd">–</div><div class="l" id="cdl">to the exam</div></div>
    <nav id="nav"></nav>
  </aside>
  <main id="main"></main>
</div>

<script>
"use strict";

/* =========================================================================
   TERM BANK — one source for the notes, the drills and the weak-spot list.
   tier 1 = appears in the professor's outline. tier 2 = textbook Key Terms
   only (mostly the "read on your own" sections).
   ========================================================================= */
const T = [
/* ---- Ch2 · cells ---- */
["neuron-motor","Motor neuron","A neuron that carries commands to the muscles and organs. Multipolar; soma in the central nervous system.",2,"Cells",1],
["neuron-sensory","Sensory neuron","A neuron that carries information from the body and from the outside world into the central nervous system.",2,"Cells",1],
["neuron-unipolar","Unipolar sensory neuron","A sensory neuron with a single short stalk from the cell body that divides into two branches. Found in the peripheral nervous system and cranial nerves.",2,"Cells",1],
["neuron-bipolar","Bipolar sensory neuron","A sensory neuron whose axon and dendritic processes are on opposite sides of the cell body. Peripheral nervous system.",2,"Cells",1],
["neuron-inter","Interneuron","A neuron that has a short axon or no axon at all and connects one neuron to another in the same part of the central nervous system.",2,"Cells",1],
["soma","Cell body (soma)","The largest part of a neuron, which contains the cell's nucleus, cytoplasm, and structures that produce proteins, convert nutrients into energy, and eliminate waste materials.",2,"Cells",1],
["dendrite","Dendrites","Extensions that branch out from the cell body to receive information from other neurons.",2,"Cells",1],
["axon","Axon","An extension from a neuron's cell body that carries information to other locations.",2,"Cells",1],
["afferent","Afferent axon","An axon carrying information toward a structure — in the periphery, sensory input travelling into the central nervous system.",2,"Cells",1,null,"Neither “afferent” nor “efferent” appears anywhere in your 6e chapters 2 or 3. Both are in your outline and on Ch3 slide 26, so they are 7e or your professor's vocabulary."],
["efferent","Efferent axon","An axon carrying information away from a structure — motor commands travelling out of the central nervous system to muscles and glands.",2,"Cells",1,null,"Same edition note as afferent: your 6e does not use the term."],
["myelin","Myelin sheath","A fatty tissue that wraps around an axon to insulate it from the surrounding fluid and from other neurons.",2,"Cells",1],
["terminal","Axon terminal (terminal button)","A swelling on the branches at the end of a neuron that contains neurotransmitters; also called an end bulb.",2,"Cells",1],
["membrane","Cell membrane","The neuron's outer boundary — about 4 nanometers thick and made up of lipid (fat) and protein. Each lipid molecule orients its head toward the extracellular and intracellular fluids and its tails inward.",2,"Cells",1,null,"Your outline says “phospholipid bilayer,” with a hydrophilic phosphate head and two hydrophobic fatty-acid tails. Your 6e only says “lipid (fat) and protein.” The more specific chemistry is 7e or instructor wording — learn it their way."],
["cytoplasm","Cytoplasm","The fluid interior of the cell body in which the organelles are suspended.",2,"Cells",1],
["nucleus-cell","Nucleus (of a neuron)","The structure inside the cell body that holds the cell's chromosomes — the genetic instructions for building proteins.",2,"Cells",1,null,"Do not confuse with “nucleus” in Ch3, which means a cluster of cell bodies in the CNS."],
["organelle","Organelles","Internal structures of the cell responsible for converting nutrients into fuel, constructing proteins and lipids, and removing waste materials.",2,"Cells",1],
["glia","Glial cell","A nonneural cell that provides several supporting functions to neurons, including myelination.",2,"Cells",1],
["oligo","Oligodendrocyte","A type of glial cell that forms the myelin covering of neurons in the brain and spinal cord.",2,"Cells",1],
["schwann","Schwann cell","A type of glial cell that forms the myelin covering on neurons outside the brain and spinal cord. Regenerates damaged cells in the PNS and acts as a bridge for regrowth.",2,"Cells",1],
["radial","Radial glia","Glial cells that, during fetal development, form scaffolds that guide new neurons to their destinations.",2,"Cells",1],
["microglia","Microglia","Glial cells that provide immune protection in the central nervous system by acting as macrophages.",2,"Cells",1],
["astrocyte","Astrocyte","A star-shaped glial cell that supports neurons structurally, contributes to the blood–brain barrier, removes and recycles transmitter from the cleft, and helps form synapses — neurons make about seven times as many connections when astrocytes are present.",2,"Cells",1],
["phagocyte","Phagocyte","A cell that engulfs and digests debris and dead cells, clearing waste from nervous tissue.",2,"Cells",1],
/* ---- Ch2 · impulse ---- */
["permeability","Selective permeability","The property of the membrane by which some molecules diffuse freely through it, some cannot pass at all, and others pass only through channels. It produces polarization — a difference in electrical charge between the inside and outside of the neuron.",2,"Impulse",1],
["resting","Resting potential","The difference in charge between the inside and outside of the membrane of a neuron at rest — typically about −70 mV.",2,"Impulse",1],
["diffusion","Force of diffusion","The force by which molecules spread from an area of higher concentration to an area of lower concentration.",2,"Impulse",1],
["electrostatic","Electrostatic pressure","The force by which like-charged ions are repelled by each other and opposite-charged ions are attracted to each other.",2,"Impulse",1],
["ion","Ion","An element or atom that is charged because it has lost or gained one or more electrons.",2,"Impulse",1],
["cation","Cation","An ion carrying a positive charge — for example Na⁺ and K⁺.",2,"Impulse",1],
["anion","Anion","An ion carrying a negative charge — for example Cl⁻ and the organic anions (A⁻) inside the cell.",2,"Impulse",1],
["napump","Sodium–potassium pump","Large protein molecules that move sodium ions through the neuron membrane to the outside and potassium ions back inside, helping maintain the resting potential.",2,"Impulse",1],
["ap","Action potential","An all-or-none electrical signal of a neuronal membrane that contains an abrupt voltage depolarization and return to resting potential; allows the neuron to communicate over long distances.",2,"Impulse",1],
["depol","Depolarization","A shift of the membrane's polarity toward zero — the negative charge inside the cell decreases, making an action potential more likely.",2,"Impulse",1],
["hyperpol","Hyperpolarization","A negative change in a neural membrane's voltage, which is inhibitory and makes an action potential less likely to occur.",2,"Impulse",1],

["ionotropic","Ionotropic receptor","A receptor that is part of the ion channel and opens the channel immediately to produce quick reactions required for muscle activity and sensory processing.",2,"Synapse",1],
["metabotropic","Metabotropic receptor","A receptor on a neuron membrane that opens ion channels slowly via a second messenger and produces long-lasting effects.",2,"Synapse",1],

["absorption","Absorption (glial)","Termination of synaptic activity in which surrounding glial cells take the transmitter up out of the cleft and recycle it — the main route for glutamate and GABA.",2,"Synapse",1],

["preexcit","Presynaptic excitation","Increased release of neurotransmitter from a neuron's terminal as the result of another neuron's release of neurotransmitter onto that terminal (an axoaxonic synapse).",2,"Synapse",1],

/* ---- Ch3 · terminology & protection ---- */
["neuroanatomy","Neuroanatomy","The study of the structure of the nervous system.",3,"Terminology",1],

["dura","Dura mater","The outermost of the three meninges — the tough outer covering.",3,"CNS",1],
["arachnoid","Arachnoid layer","The middle meningeal layer, which separates the blood and the cerebrospinal fluid.",3,"CNS",1],
["pia","Pia mater","The innermost meningeal layer, lying directly on the surface of the brain.",3,"CNS",1],
["subarach","Subarachnoid space","The space beneath the arachnoid layer through which cerebrospinal fluid circulates around the brain and spinal cord.",3,"CNS",1],
["bbb","Blood–brain barrier","The brain's protection from toxic substances and neurotransmitters in the bloodstream; the small openings in the capillary walls prevent large molecules from passing through unless they are fat soluble or carried through by special transporters.",3,"CNS",1],
["prosen","Prosencephalon (forebrain)","The most anterior of the three main divisions of the brain, comprising the telencephalon and the diencephalon.",3,"CNS",1],
["telen","Telencephalon","The division of the forebrain containing the cerebral cortex, basal ganglia, limbic system and olfactory system.",3,"CNS",1],
["dien","Diencephalon","The division of the forebrain containing the thalamus and hypothalamus.",3,"CNS",1],
["mesen","Mesencephalon (midbrain)","The middle part of the brain, consisting of the tectum (roof) on the dorsal side and the tegmentum on the ventral side.",3,"CNS",1],
["rhomben","Rhombencephalon (hindbrain)","The most posterior of the three main divisions of the brain, containing the medulla, pons and cerebellum.",3,"CNS",1],
/* ---- Ch3 · forebrain ---- */
["basal","Basal ganglia","The caudate nucleus, putamen and globus pallidus (with the nucleus accumbens), located subcortically in the frontal lobes. Voluntary movement, emotional expression, habit formation and reward.",3,"Forebrain",1],
["limbic","Limbic system","A group of forebrain structures arranged around the upper brain stem that have roles in emotion, motivated behavior, and learning.",3,"Forebrain",1],
["hippocampus","Hippocampus","A limbic structure responsible for learning and long-term memory consolidation; connected by the fornix.",3,"Forebrain",1],
["amygdala","Amygdala","A limbic system structure located near the lateral ventricle in each temporal lobe, involved with a variety of emotions — especially fear and anxiety — and with sexual behavior, aggression, and learning in emotional situations.",3,"Forebrain",1],
["cingulate","Cingulate gyrus","A limbic structure involved in emotional processing and behavioral regulation.",3,"Forebrain",1],
["olfactory","Olfactory system","The olfactory bulb and tracts, which process the sense of smell.",3,"Forebrain",1],
["cortex","Cerebral cortex","The outer layer of the cerebrum, responsible for the highest level of information processing.",3,"Forebrain",1],
["thalamus","Thalamus","A forebrain structure lying just below the lateral ventricles, which receives information from all sensory systems except olfaction and relays it to the respective cortical projection areas.",3,"Forebrain",1],
["hypothalamus","Hypothalamus","A subcortical structure in the forebrain just below the thalamus that plays a major role in controlling emotion and motivated behaviors, such as eating, drinking, and sexual activity. It also controls the autonomic nervous system and the endocrine system.",3,"Forebrain",1],
["pituitary","Pituitary gland","The “master gland” of the endocrine system, controlled by the hypothalamus.",3,"Forebrain",1],
["pineal","Pineal gland","The gland governing circadian and seasonal rhythms through the release of melatonin.",3,"Forebrain",1],

["infcol","Inferior colliculus","A tectal structure responsible for auditory processing and sound localization.",3,"Midbrain",1],

["rednuc","Red nucleus","A tegmental structure governing muscle tone and limb movements.",3,"Midbrain",1],
["reticular","Reticular formation","A collection of more than 90 nuclei running through the middle of the hindbrain and the midbrain with roles in sleep and arousal, attention, reflexes, and muscle tone.",3,"Midbrain",1],

["lateral","Lateral","Toward the side.",3,"Cortex",1],

 {id:"aff",title:"Afferent vs. Efferent",why:"Pure vocabulary — no concept to understand, only a direction to fix.",

 {id:"nak",title:"Na⁺ vs. K⁺ during the action potential",why:"Two ions, two directions, two phases. Reversing them reverses the whole curve.",
  sides:[{c:"e",h:"Sodium (Na⁺)",p:["Concentrated <b>outside</b> at rest","Rushes <b>in</b> at threshold","Drives the <b>rising</b>, depolarizing phase","Its channels inactivate at the peak → absolute refractory period"]},
         {c:"i",h:"Potassium (K⁺)",p:["Concentrated <b>inside</b> at rest","Flows <b>out</b> after the peak","Drives the <b>falling</b>, repolarizing phase","Its slow closing causes the undershoot"]}],
  tell:"The pump keeps the gradient the action potential spends: 3 Na⁺ <b>out</b> for every 2 K⁺ <b>in</b>. Both ions move down their gradient during the spike — Na⁺ in, K⁺ out — and the pump pays it back afterward."},
 {id:"psp",title:"EPSP vs. IPSP",why:"Both are graded potentials at the dendrites and soma. Only the sign differs — and the sign is the whole answer.",
  sides:[{c:"e",h:"EPSP",p:["Partial <b>de</b>polarization","Makes the neuron <b>more</b> likely to fire","Glutamate opening Na⁺ gates"]},
         {c:"i",h:"IPSP",p:["<b>Hyper</b>polarization","Makes the neuron <b>less</b> likely to fire","GABA opening Cl⁻ gates"]}],
  tell:"Neither one is an action potential. Both are graded — they vary with stimulus strength, and they are summed at the axon hillock, where the all-or-none decision actually happens."},
 {id:"recep",title:"Ionotropic vs. Metabotropic",why:"Speed and duration are the discriminator, not which transmitter binds.",
  sides:[{c:"e",h:"Ionotropic",p:["Receptor <b>is part of</b> the ion channel","Opens the channel <b>immediately</b>","Quick, brief","Muscle activity and sensory processing"]},

  tell:"“Metabo” = metabolic = a chemical chain of events inside the cell. If the answer mentions a second messenger, it is metabotropic."},
 {id:"summ",title:"Spatial vs. Temporal summation",why:"Space vs. time. The words tell you, but under exam pressure they blur.",
  sides:[{c:"n",h:"Spatial",p:["Potentials occurring <b>simultaneously</b>","At <b>different locations</b> on the dendrites and cell body","Many inputs at once"]},
         {c:"n",h:"Temporal",p:["Potentials arriving <b>a short time apart</b>","From the same or separate inputs","One input firing rapidly"]}],
  tell:"<b>Spa</b>tial = <b>spa</b>ce = different <b>places</b>. <b>Tempo</b>ral = <b>tempo</b> = timing. Both are combined at the axon hillock."},
 {id:"vent",title:"The ventricles, in order",why:"Four cavities plus a canal, and the exam will ask about the order or the connections.",
  sides:[{c:"n",h:"Top to bottom",p:["<b>Lateral</b> ventricles — one per hemisphere","<b>Third</b> ventricle — between the two thalami","<b>Cerebral aqueduct</b> — passes through the midbrain","<b>Fourth</b> ventricle — in the hindbrain","<b>Central canal</b> — down the spinal cord"]},
         {c:"n",h:"What fills them",p:["Cerebrospinal fluid (CSF)","Cushioning","Physical support","Reservoir for hormones and nutrients","Carries waste away"]}],
  tell:"The aqueduct is the only one that is a passage rather than a cavity — and it is the landmark for the midbrain, which is why the periaqueductal grey is named for sitting around it."},
 {id:"coll",title:"Superior vs. Inferior colliculus",why:"Classic matching-question bait: same structure, same name, opposite senses.",

  tell:"Your eyes sit <b>above</b> your ears: superior → seeing, inferior → hearing. Both are in the tectum — the roof of the midbrain."},
 {id:"aph",title:"Broca's vs. Wernicke's",why:"Two areas, two lobes, two aphasias. The most-tested pair in the chapter.",
  sides:[{c:"e",h:"Broca's area",p:["<b>Frontal</b> lobe, anterior to the motor area","Speech <b>production</b>","Damage → difficulty <b>producing</b> speech and writing","Broca's aphasia: halting, effortful, comprehension intact"]},
         {c:"i",h:"Wernicke's area",p:["<b>Temporal</b> lobe, posterior to the auditory cortex","Speech <b>comprehension</b>","Damage → trouble <b>understanding</b> speech or writing","Wernicke's aphasia: fluent but meaningless “word salad”"]}],
  tell:"<b>B</b>roca = <b>B</b>reaking the words out (production, and it is at the front, near the motor cortex that moves the mouth). Wernicke sits next to the auditory cortex, where language comes <b>in</b>."},
 {id:"ans",title:"Sympathetic vs. Parasympathetic wiring",why:"Everyone knows fight-or-flight vs. rest-and-digest. The axon lengths and transmitters are where the points are lost.",

  tell:"Only <b>one</b> of the four legs uses norepinephrine: the sympathetic <b>post</b>ganglionic. Everything else in the ANS is acetylcholine. Ganglion position determines axon length — sympathetic ganglia are near the spine, so the second leg is long."},
 {id:"conv",title:"Sulcus vs. Fissure vs. Gyrus",why:"Two grooves and a ridge. The only difference between the grooves is depth.",
  sides:[{c:"n",h:"Sulcus",p:["A <b>shallow</b> groove","Between two gyri","Not as deep as a fissure"]},

  tell:"Gyrus is the bump, sulcus is the dip, fissure is a deep dip. The precentral gyrus is motor; the postcentral gyrus is somatosensory — and they sit either side of the central sulcus."},

 {id:"myel",title:"Oligodendrocytes vs. Schwann cells",why:"Same job, different half of the nervous system — and your professor retitled slide 12 to put this contrast front and centre.",

var drill={mode:"mc",pool:"all",q:null,answered:false,right:0,total:0,matchState:null};

function poolTerms(){
  if(drill.pool==="all") return T.slice();
  if(drill.pool==="ch2") return T.filter(function(t){return t.ch===2;});
  if(drill.pool==="ch3") return T.filter(function(t){return t.ch===3;});
  if(drill.pool==="weak"){
    var w=T.filter(function(t){return (S.missed[t.id]||0)>0;});
    return w.length?w:T.slice();
  }
  return T.filter(function(t){return t.sec===drill.pool;});
}
function shuffle(a){for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var x=a[i];a[i]=a[j];a[j]=x;}return a;}
function pickWeighted(pool){
  var bag=[];
  pool.forEach(function(t){
    var m=S.missed[t.id]||0, s=S.seen[t.id]||0;
    var w=1+m*3+(s===0?1:0);
    for(var i=0;i<w;i++) bag.push(t);
  });
  return bag[Math.floor(Math.random()*bag.length)];
}
function mark(id,ok){
  S.seen[id]=(S.seen[id]||0)+1;
  if(ok){ if(S.missed[id]) S.missed[id]=Math.max(0,S.missed[id]-1); }
  else S.missed[id]=(S.missed[id]||0)+1;
  drill.total++; if(ok) drill.right++;
  save();
}
function norm(s){
  return String(s).toLowerCase()
    .replace(/’/g,"'")
    .replace(/\([^)]*\)/g,"")
    .replace(/[^a-z0-9' ]/g," ")
    .replace(/\b(the|a|an|of)\b/g," ")
    .replace(/\s+/g," ").trim();
}
function answerOK(input,term){
  var a=norm(input), b=norm(term);
  if(!a) return false;
  if(a===b) return true;
  var bshort=b.split("'")[0].trim();
  if(a===bshort) return true;
  // accept the distinctive head of a multiword term, min 4 chars
  if(b.indexOf(a)===0 && a.length>=Math.max(4,b.length*0.55)) return true;
  return false;
}
function newQuestion(){
  var pool=poolTerms();
  drill.answered=false; drill.matchState=null;
  if(drill.mode==="match"){
    var pick=shuffle(pool.slice()).slice(0,Math.min(5,pool.length));
    drill.q={items:pick,defs:shuffle(pick.slice())};
    drill.matchState={sel:null,solved:{},missed:{}};
  } else if(drill.mode==="conf"){
    var c=CONF[Math.floor(Math.random()*CONF.length)];
    var si=Math.floor(Math.random()*c.sides.length);
    var side=c.sides[si];
    var pts=side.p.filter(function(p){return p.replace(/<[^>]+>/g,"").length>8;});
    drill.q={conf:c,side:si,clue:pts[Math.floor(Math.random()*pts.length)]};
  } else {
    var t=pickWeighted(pool);
    if(drill.mode==="mc"){
      var same=pool.filter(function(o){return o.id!==t.id&&o.sec===t.sec;});
      var others=shuffle(same.length>=3?same:pool.filter(function(o){return o.id!==t.id;})).slice(0,3);
      drill.q={t:t,opts:shuffle([t].concat(others))};
    } else {
      drill.q={t:t};
    }
  }
  renderMain();
}

    drill.q.items.forEach(function(t){

  h+='<div class="scoreline"><span>This session <b>'+drill.right+'</b> / <b>'+drill.total+'</b></span>'+
     '<span>Terms seen <b>'+Object.keys(S.seen).length+'</b> / '+T.length+'</span></div></div>';

function wireDrill(){
  document.querySelectorAll(".mode").forEach(function(b){
    b.onclick=function(){ drill.mode=b.dataset.m; drill.q=null; renderMain(); };
  });
  var ps=document.getElementById("poolsel");

  var st=document.getElementById("start"); if(st) st.onclick=newQuestion;
  var nx=document.getElementById("next"); if(nx) nx.onclick=newQuestion;

        if(drill.answered) return; drill.answered=true;

        mark(drill.q.t.id,ok);

        '<span class="ans"><b>'+esc(drill.q.t.term)+'</b></span></div>';

    };
    if(go) go.onclick=check;

        else { ms.missed[b.dataset.d]=true; }
        ms.sel=null;
        renderMain(); renderNav();
      };
    });
    if(Object.keys(ms.solved).length===drill.q.items.length && drill.q.items.length){
      v.innerHTML='<div class="verdict ok">All five matched.</div>';
    }
  }
  if(drill.mode==="conf"&&drill.q){
    document.querySelectorAll("[data-c]").forEach(function(b){
      b.onclick=function(){
        if(drill.answered) return; drill.answered=true;

      h+='<article class="conf"><header><h3>'+esc(c.title)+'</h3><span class="why">'+esc(c.why)+'</span></header><div class="split">';
      c.sides.forEach(function(s){
        h+='<div class="side '+s.c+'"><h4>'+esc(s.h)+'</h4><ul>'+s.p.map(function(p){return "<li>"+p+"</li>";}).join("")+'</ul></div>';
      });
      h+='</div><div class="tell"><b>The tell</b>'+c.tell+'</div></article>';
    });
    h+='</div>';
  }
  else if(view==="tables"){
    h=head("Reference","Master tables",
      "The two consolidated structure-to-function tables are your professor's own work, not the publisher's. For a matching exam they are the closest thing you have to the answer key.")+
      '<div class="wrap wide">'+TABLES.map(renderTable).join("")+'</div>';
  }
  else if(view==="fixes"){
    h=head("Reference","Corrections",
      "Errors and edition gaps I found while building this. None of them are your fault; all of them will waste your time if you hit them cold.")+'<div class="wrap">';
    h+='<div class="callout exc"><h4>Your textbook is one edition behind your course</h4>'+
       'Your slides carry the footer <i>Garrett, Brain &amp; Behavior, 7e</i>. The EPUB you have is the <b>6th edition (2021)</b>. Your professor\'s outline references match the 7e exactly, so their numbering is right and your book is the outlier. You said you can\'t get the 7e — you don\'t need to. The structure and numbering come from the outlines and slides; the 6e still gives you every definition.</div>';
    [["Fig. 12.13, 12.14, 12.17 <span class='chip ref'>Ch 2 outline</span>","Typos for <b>2.13, 2.14, 2.17</b>. Chapter 12 is Learning and Memory — its Fig. 12.13 is retention in αCaMKII-deficient mice. The Chapter 2 versions are Loewi's experiment, calcium entry and vesicle fusion, and spatial/temporal summation."],
     ["“Midbrain — Slide 7” <span class='chip ref'>Ch 3 outline</span>","Slide 7 is an unlabelled brain-stem image with no text on it. The midbrain material — tectum, tegmentum, colliculi, substantia nigra, VTA, PAG, red nucleus — is on <b>slide 20</b>."],
     ["Table 2.3 <span class='chip ref'>Ch 2 outline</span>","Correct in the 7e. In your 6e there is no Table 2.3 — the twelve transmitters are <b>Table 2.2, p. 40</b>."],
     ["Spinal Cord, pg. 79–80","Your 6e: <b>pp. 66–68</b>."],
     ["Stages of Development, pg. 85–88","Your 6e: <b>pp. 72–76</b>."],
     ["Experience Modifies the NS, pg. 88–89","Your 6e: <b>pp. 76–78</b>."],
     ["Damage and Recovery, pg. 89–97","Your 6e: <b>pp. 78–85</b>. Chapter 3 ends at p. 89 in your edition, so the outline's range runs off the end of the chapter."],
     ["Ventricles, Fig. 3.16","Correct in the 7e. In your 6e, Fig. 3.16 is the brain stem."],
     ["Cranial nerves, Fig. 3.22","Correct in the 7e. In your 6e, Fig. 3.22 is the autonomic nervous system."],
     ["Lorenzo &amp; Hecht, Fig. 2.24","Correct in the 7e. In your 6e it is <b>Fig. 2.23</b>."],
     ["“Statacoustic” nerve <span class='chip prof'>slide 25</span>","Your professor's term for cranial nerve VIII. Standard name: <b>vestibulocochlear</b> (or auditory). Write theirs on the exam."],
     ["“Afferent” / “efferent”","Neither word appears in your 6e's chapters 2 or 3. Both are in your outline and on slide 26 — 7e or instructor vocabulary. Learn them; don't go looking in the book."],
     ["“Phospholipid bilayer”","Your outline specifies a hydrophilic phosphate head and two hydrophobic fatty-acid tails. Your 6e only says the membrane is “made up of lipid (fat) and protein.” The detailed chemistry is 7e or instructor wording."]
    ].forEach(function(f){
      h+='<div class="fixrow"><div><div class="h">As written</div><div class="v">'+f[0]+'</div></div>'+
         '<div><div class="h">What’s true</div><div class="v">'+f[1]+'</div></div></div>';
    });
    h+='<div class="callout"><h4>Two slides I could not read</h4>Chapter 2 slides 8 (Types of Glial Cells) and 19 (Representative Neurotransmitters) are flat images with no text layer. I filled both sections from your textbook instead — the glial types from the chapter prose, the transmitters from the table above. If your professor put anything extra on those two slides, it is the one thing here I could not check.</div>';
    h+='</div>';
  }
  m.innerHTML=h;

  if(view==="plan"){
    m.querySelectorAll("input[type=checkbox]").forEach(function(c){
      c.onchange=function(){ S.plan[c.dataset.d]=c.checked; save(); renderMain(); renderNav(); };
    });
  }
  if(view==="drill") wireDrill();
  if(view==="weak"){
    var dw=document.getElementById("drillweak");
    if(dw) dw.onclick=function(){ view="drill"; drill.pool="weak"; drill.mode="fib"; drill.q=null; render(); newQuestion(); };
  }
}
function render(){ renderNav(); renderMain(); }
</script>
